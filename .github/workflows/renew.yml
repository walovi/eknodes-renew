name: Auto-Renew-EkNodes
on:
  schedule:
    - cron: '0 3 */3 * *'  # 每 3 天 03:00 UTC 运行一次（3 天一续，按需修改）
  workflow_dispatch:

jobs:
  Renew-eknodes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: write
    steps:
      - name: 📥 下载公库代码
        uses: actions/checkout@v5

      - name: 🔒 拉取私有仓库脚本
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/eknodes_renew_private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-scripts

      - name: ⚙️ 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🌐 设置sing-box代理转发
        continue-on-error: true
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)

      - name: 🚀 运行私库续期脚本
        env:
          PYTHONIOENCODING: utf-8
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          NODE_LINK: "socks5://127.0.0.1:1080"
        # python3 -m pip 保证安装到 python3 对应的解释器；socks 代理(sing-box 出口)需要 pysocks
        run: |
          python3 -m pip install --quiet pysocks
          python3 -c "import socks; print('pysocks OK')"
          python3 private-scripts/eknodes_renew.py

      - name: 🧹 清理旧的工作流运行记录
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh run list --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
          count=0
          for run_id in $runs; do
            count=$((count + 1))
            if [ $count -gt 1 ]; then
              echo "删除运行记录: $run_id"
              gh run delete $run_id || true
            fi
          done
